spring:
  datasource:
    # H2 in PostgreSQL mode; TIMESTAMPTZ and JSONB are declared as aliases because H2 does not know them
    url: jdbc:h2:mem:ats_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE\;CREATE DOMAIN IF NOT EXISTS JSONB AS CHARACTER VARYING
    username: sa
    password:
    driver-class-name: org.h2.Driver

ats:
  storage:
    cv-directory: target/test-cvs
  jobs:
    auto-close-cron: "-"
  security:
    jwt:
      secret: test-only-jwt-secret-with-at-least-32-characters
