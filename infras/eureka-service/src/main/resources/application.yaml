server:
  port: ${EUREKA_PORT:8761}

spring:
  application:
    name: eureka-service

eureka:
  client:
    fetch-registry: false
    register-with-eureka: false
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info
