server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    gateway:
      server:
        webflux:
          filter:
            request-rate-limiter:
              deny-empty-key: true
              empty-key-status-code: TOO_MANY_REQUESTS
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userRateLimitKeyResolver}"
                    redis-rate-limiter.replenishRate: ${USER_SERVICE_RATE_LIMIT_REPLENISH_RATE:1}
                    redis-rate-limiter.burstCapacity: ${USER_SERVICE_RATE_LIMIT_BURST_CAPACITY:2}
                    redis-rate-limiter.requestedTokens: ${USER_SERVICE_RATE_LIMIT_REQUESTED_TOKENS:1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
