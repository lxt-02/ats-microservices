# Default: the application + PostgreSQL.
#   docker compose up --build
# With Prometheus and Grafana:
#   docker compose --profile monitoring up --build
services:
  app:
    build: .
    image: ats-app:local
    ports:
      - "8080:8080"
    environment:
      ATS_DATASOURCE_URL: jdbc:postgresql://db:5432/ats
      ATS_DATASOURCE_USERNAME: ats
      ATS_DATASOURCE_PASSWORD: ${ATS_DB_PASSWORD:-ats}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
      GOOGLE_SCOPES: ${GOOGLE_SCOPES:-openid,profile,email}
      GOOGLE_ALLOWED_REDIRECT_URIS: ${GOOGLE_ALLOWED_REDIRECT_URIS:-}
      GOOGLE_AUTO_REGISTER_CANDIDATES: ${GOOGLE_AUTO_REGISTER_CANDIDATES:-true}
      ATS_JWT_SECRET: ${ATS_JWT_SECRET:-dev-only-change-this-ats-jwt-secret-32-chars-minimum}
      ATS_JWT_ISSUER: ${ATS_JWT_ISSUER:-ats-auth-service}
      ATS_ACCESS_TOKEN_TTL_SECONDS: ${ATS_ACCESS_TOKEN_TTL_SECONDS:-900}
      ATS_REFRESH_TOKEN_TTL_SECONDS: ${ATS_REFRESH_TOKEN_TTL_SECONDS:-604800}
      ATS_CV_DIRECTORY: /app/data/cvs
    volumes:
      - cv-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12

  db:
    image: postgres:17-alpine
    container_name: ats-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ${ATS_DB_PASSWORD:-ats}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats"]
      interval: 10s
      timeout: 3s
      retries: 12

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.3
    container_name: ats-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infras/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.1
    container_name: ats-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infras/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infras/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  db-data:
  cv-data:
  grafana-data:
