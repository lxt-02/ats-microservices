services:
  eureka-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: infras/eureka-service
    image: ats-eureka-service:local
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-service
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: infras/api-gateway
    image: ats-api-gateway:local
    ports:
      - "8080:8080"
    environment:
      EUREKA_DEFAULT_ZONE: http://eureka-service:8761/eureka/
      REDIS_HOST: redis
      USER_SERVICE_RATE_LIMIT_REPLENISH_RATE: 50
      USER_SERVICE_RATE_LIMIT_BURST_CAPACITY: 100
    depends_on:
      eureka-service:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_PATH: services/user-service
    image: ats-user-service:local
    environment:
      EUREKA_DEFAULT_ZONE: http://eureka-service:8761/eureka/
      USER_SERVICE_PORT: 8081
    depends_on:
      eureka-service:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: ats-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:v3.5.3
    container_name: ats-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infras/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      user-service:
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ats-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infras/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infras/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  redis-data:
  grafana-data:
